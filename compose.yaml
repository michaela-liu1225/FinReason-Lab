services:
  api:
    build:
      context: .
      args:
        FINREASON_EXTRAS: ${FINREASON_DOCKER_EXTRAS:-api}
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FINREASON_DATASET_PATH: /data/dev.json
      FINREASON_MODEL_BASE_URL: ${FINREASON_MODEL_BASE_URL:-}
      FINREASON_MODEL_NAME: ${FINREASON_MODEL_NAME:-}
      FINREASON_MODEL_REVISION: ${FINREASON_MODEL_REVISION:-}
      FINREASON_TOKENIZER_REVISION: ${FINREASON_TOKENIZER_REVISION:-}
      FINREASON_ADAPTER_REVISION: ${FINREASON_ADAPTER_REVISION:-}
      FINREASON_CHAT_TEMPLATE_SHA256: ${FINREASON_CHAT_TEMPLATE_SHA256:-}
      FINREASON_MODEL_API_KEY: ${FINREASON_MODEL_API_KEY:-}
      FINREASON_MODEL_TIMEOUT: ${FINREASON_MODEL_TIMEOUT:-60}
      FINREASON_MODEL_TEMPERATURE: ${FINREASON_MODEL_TEMPERATURE:-0}
      FINREASON_MODEL_TOP_P: ${FINREASON_MODEL_TOP_P:-1}
      FINREASON_MODEL_MAX_TOKENS: ${FINREASON_MODEL_MAX_TOKENS:-512}
      FINREASON_MODEL_SEED: ${FINREASON_MODEL_SEED:-42}
      FINREASON_MODEL_ENABLE_THINKING: ${FINREASON_MODEL_ENABLE_THINKING:-}
      FINREASON_EMBEDDING_MODEL: ${FINREASON_EMBEDDING_MODEL:-}
      FINREASON_EMBEDDING_REVISION: ${FINREASON_EMBEDDING_REVISION:-}
      FINREASON_RERANKER_MODEL: ${FINREASON_RERANKER_MODEL:-}
      FINREASON_RERANKER_REVISION: ${FINREASON_RERANKER_REVISION:-}
    volumes:
      - ${FINREASON_DATA_DIR:-./raw_data/finqa}:/data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
